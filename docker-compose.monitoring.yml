# Supervision : métriques (Prometheus), alertes (Alertmanager), logs (Loki), dashboards (Grafana)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring, backend]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: prs-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]
    logging: *default-logging

  alert-logger:
    image: python:3.12-alpine
    container_name: prs-alert-logger
    restart: unless-stopped
    command: ["python", "-u", "/app/alert_logger.py"]
    volumes:
      - ./monitoring/alert-logger/alert_logger.py:/app/alert_logger.py:ro
    networks: [monitoring]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: prs-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: prs-cadvisor
    restart: unless-stopped
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: prs-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://exporter:${EXPORTER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [backend]
    logging: *default-logging

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: prs-mongodb-exporter
    restart: unless-stopped
    command: ["--collector.diagnosticdata", "--collector.dbstats"]
    environment:
      MONGODB_URI: "mongodb://exporter:${MONGO_EXPORTER_PASSWORD}@mongo:27017/admin"
    networks: [backend]
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.0
    container_name: prs-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.0
    container_name: prs-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    depends_on:
      - loki
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    container_name: prs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring]
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

networks:
  monitoring:
  backend:
    internal: true

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
