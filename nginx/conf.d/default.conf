# Journal d'accès au format JSON (exploitable dans Loki avec : | json)
log_format json_combined escape=json
'{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
'"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
'"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
# Limitation de débit : 10 requêtes/seconde par adresse IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server_tokens off;
# --- HTTP : healthcheck + redirection vers HTTPS --------------------------------
server {
listen 80;
server_name _;
location = /nginx-health {
access_log off;
default_type text/plain;
return 200 "ok\n";
}
location / {
return 301 https://$host$request_uri;
}
}
# --- HTTPS : reverse proxy vers l'API -------------------------------------------
server {
listen 443 ssl;
http2 on;
server_name _;
ssl_certificate /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
access_log /dev/stdout json_combined;
error_log /dev/stderr warn;
# En-têtes de sécurité
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
client_max_body_size 1m;
# DNS interne de Docker : Nginx re-résout "api" toutes les 10 s.
# Sans cela, Nginx garde l'ancienne IP après un redémarrage de l'API (502 persistant).
resolver 127.0.0.11 valid=10s ipv6=off;
# Les métriques ne sont jamais exposées à l'extérieur (Prometheus les lit en interne)
location = /metrics {
return 404;
}
location / {
limit_req zone=api_limit burst=20 nodelay;
limit_req_status 429;
set $upstream_api http://api:8000;
proxy_pass $upstream_api;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
}
}
